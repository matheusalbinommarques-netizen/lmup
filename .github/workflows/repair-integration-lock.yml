name: Repair integration lockfile

on:
  push:
    branches:
      - integration/lmup-review-2026-10-31
    paths:
      - .github/workflows/repair-integration-lock.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile without installing scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(integration): synchronize npm lockfile"
          git push origin HEAD:integration/lmup-review-2026-10-31
