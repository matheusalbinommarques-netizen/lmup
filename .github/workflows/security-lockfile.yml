name: Temporary security lockfile regeneration
on:
  push:
    branches:
      - chore/security-dependencies
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Regenerate dependency lockfile without installing scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit reviewed lockfile chunks for GitHub connector update
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const data = readFileSync("package-lock.json", "utf8");
            for (let i = 0; i < data.length; i += 4000) {
              console.log("LMUP_LOCK_CHUNK " + (i / 4000) + " " + JSON.stringify(data.slice(i, i + 4000)));
            }
            console.log("LMUP_LOCK_END " + data.length);
          '
