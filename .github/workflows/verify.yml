name: Verificar LMU

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Re-running a PR replaces stale checks; pushes to main must never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      # One Node version's known audit failure must not cancel browser checks.
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - if: matrix.node == 24
        run: npx playwright install --with-deps chromium
      - name: Check cross-tab update stability
        if: matrix.node == 24
        run: npm run test:pwa -- --grep "outra aba com notas" --repeat-each 5 --retries 0 --max-failures 1
        env:
          LMU_PWA_DIAGNOSTICS: '1'
      - if: matrix.node == 24
        run: npm run test:e2e
      - if: matrix.node == 24
        run: npm run test:pwa
      - name: Preserve browser failure evidence
        if: failure() && matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: browser-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            test-results-pwa/
          retention-days: 14
          if-no-files-found: ignore
      - if: matrix.node == 24
        run: npm run test:package
      # Keep the strict audit mandatory; run functional checks before it so
      # pre-existing advisories cannot hide unrelated regressions.
      - run: npm run audit:security
      # Even after a failed test, detect accidental modifications to tracked files.
      - name: Ensure tests did not modify versioned files
        if: ${{ !cancelled() }}
        run: |
          if ! git diff --quiet HEAD --; then
            echo "::error::Tests or build changed tracked files. Review the changes before merging."
            git status --short
            git diff --stat HEAD --
            exit 1
          fi
