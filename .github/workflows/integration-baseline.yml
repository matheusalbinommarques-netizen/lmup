name: Baseline LMUP integration

on:
  push:
    branches:
      - integration/lmup-review-2026-10-31
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type and Svelte checks
        run: npm run check
      - name: Unit tests
        if: success() || failure()
        run: npm test -- --run
      - name: Build
        if: success() || failure()
        run: npm run build
      - name: Inventory dependency vulnerabilities (baseline only)
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=moderate
