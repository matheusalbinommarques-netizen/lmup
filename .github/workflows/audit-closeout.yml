name: Validar fechamento da auditoria

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/audit-closeout.yml'
      - 'scripts/perf/closeout.mjs'
      - 'scripts/perf/m06.config.mjs'

permissions:
  contents: read

concurrency:
  group: audit-closeout-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Comparar C02 com C01 e reexecutar M06
        run: node scripts/perf/closeout.mjs
      - name: Confirmar restauração dos fontes
        if: ${{ !cancelled() }}
        run: git diff --exit-code HEAD -- src/services/rewardService.ts
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: auditoria-c02-${{ github.run_id }}
          path: perf-results/
          retention-days: 7
          if-no-files-found: error
